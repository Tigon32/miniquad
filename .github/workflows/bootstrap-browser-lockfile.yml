name: Bootstrap browser test lockfile (one-shot)

on:
  push:
    branches:
      - test/browser-wasm-smoke

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.repository == 'Tigon32/miniquad' && github.actor == 'Tigon32' && github.ref == 'refs/heads/test/browser-wasm-smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and verify locked browser dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node --check tests/browser/serve.mjs
          node --check tests/browser/quad.spec.mjs
      - name: Commit the lockfile and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/bootstrap-browser-lockfile.yml
          git diff --cached --quiet && exit 1
          git commit -m "build: lock browser smoke test dependencies"
          git push origin HEAD:refs/heads/test/browser-wasm-smoke
