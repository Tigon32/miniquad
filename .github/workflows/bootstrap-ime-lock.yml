name: Lock standalone IME example (one-shot)
on:
  push:
    branches: [security/replace-ime-fontdue-with-skrifa]
permissions:
  contents: write
concurrency:
  group: ime-demo-bootstrap
  cancel-in-progress: true
jobs:
  lock:
    if: github.repository == 'Tigon32/miniquad' && github.actor == 'Tigon32' && github.ref == 'refs/heads/security/replace-ime-fontdue-with-skrifa'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve and compile standalone IME demo
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo generate-lockfile --manifest-path examples/ime_demo/Cargo.toml
          cargo check --manifest-path examples/ime_demo/Cargo.toml --locked
      - name: Commit lockfile and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/ime_demo/Cargo.lock
          git rm .github/workflows/bootstrap-ime-lock.yml
          git diff --cached --quiet && exit 1
          git commit -m "build: lock isolated IME demo dependencies"
          git push origin HEAD:refs/heads/security/replace-ime-fontdue-with-skrifa
