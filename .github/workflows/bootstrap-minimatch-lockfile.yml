name: Generate patched minimatch lockfile (one-shot)
on:
  push:
    branches:
      - security/minimatch-11-advisory

permissions:
  contents: write

concurrency:
  group: security-minimatch-lockfile
  cancel-in-progress: true

jobs:
  lock:
    if: github.repository == 'Tigon32/miniquad' && github.actor == 'Tigon32' && github.ref == 'refs/heads/security/minimatch-11-advisory'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Generate a lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify new dependency graph
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint:js
          node --test tests/*.test.cjs
          npm audit --package-lock-only --audit-level=moderate
      - name: Commit generated lockfile and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/bootstrap-minimatch-lockfile.yml
          git diff --cached --quiet && exit 1
          git commit -m "security: lock patched minimatch dependency graph"
          git push origin HEAD:refs/heads/security/minimatch-11-advisory
