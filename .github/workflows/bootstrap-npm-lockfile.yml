name: Generate reviewed npm lockfile (one-shot)
on:
  push:
    branches:
      - chore/npm-lockfile-and-ci

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'Tigon32/miniquad' && github.ref == 'refs/heads/chore/npm-lockfile-and-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Resolve exact ESLint dependencies without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm the reproducible install and lint
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint:js
      - name: Commit only the lockfile and retire this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/bootstrap-npm-lockfile.yml
          git diff --cached --quiet && exit 1
          git commit -m "build: commit resolved ESLint lockfile"
          git push origin HEAD:refs/heads/chore/npm-lockfile-and-ci
