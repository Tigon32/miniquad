name: Miniquad three-engine browser acceptance
on:
  pull_request:
    branches: [master]
    paths:
      - 'tests/browser/**'
      - 'js/**'
      - 'companions/draw/**'
      - 'experiments/drawing-comparison/external-consumer/**'
      - 'companions/voxel/**'
      - 'templates/browser/**'
      - 'scripts/create-browser-project.mjs'
      - 'examples/offscreen.rs'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-acceptance-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-matrix-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap Rustup in the local container
        if: ${{ env.ACT }}
        run: bash scripts/install-local-rust.sh
      - name: Install Rust WASM target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Compile checked-in browser fixtures
        run: cargo build --release --target wasm32-unknown-unknown --example quad --example offscreen
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: ${{ !env.ACT && 'npm' || '' }}
      - name: Install locked tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build optional drawing and external consumer fixtures
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path companions/draw/Cargo.toml --example showcase
          cargo build --release --locked --target wasm32-unknown-unknown --manifest-path experiments/drawing-comparison/external-consumer/Cargo.toml --example consume
          cargo build --release --target wasm32-unknown-unknown --manifest-path companions/voxel/Cargo.toml --example offline
          node scripts/create-browser-project.mjs "$RUNNER_TEMP/miniquad-browser-starter" --source path --miniquad-path "$GITHUB_WORKSPACE" --name miniquad-browser-starter
          node "$RUNNER_TEMP/miniquad-browser-starter/scripts/build.mjs"
          echo "MINIQUAD_STARTER_PATH=$RUNNER_TEMP/miniquad-browser-starter" >> "$GITHUB_ENV"
      - name: Install pinned Playwright browser engines and host dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Chromium headless and Firefox/WebKit with virtual display
        run: |
          status=0
          MINIQUAD_BROWSER=chromium npm run test:browser || status=1
          xvfb-run -a env MINIQUAD_HEADFUL=1 MINIQUAD_BROWSER=firefox npm run test:browser || status=1
          xvfb-run -a env MINIQUAD_HEADFUL=1 MINIQUAD_BROWSER=webkit npm run test:browser || status=1
          exit "$status"
      - name: Store traces when an engine fails
        if: ${{ failure() && !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: three-engine-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
