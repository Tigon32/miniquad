name: Miniquad three-engine browser acceptance
on:
  pull_request:
    branches: [master]
    paths:
      - 'tests/browser/**'
      - 'js/gl.js'
      - 'examples/offscreen.rs'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-acceptance-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-matrix-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust WASM target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Compile checked-in browser fixtures
        run: cargo build --release --target wasm32-unknown-unknown --example quad --example offscreen
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright browser engines and host dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run all three browser engines
        run: npm run test:browser
      - name: Store traces when an engine fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: three-engine-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
