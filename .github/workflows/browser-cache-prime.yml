name: Prime Playwright browser cache

# Write the cache on the trusted default branch.
# Caches written by a pull request are not shared with other pull requests.
on:
  push:
    branches:
      - master
    paths:
      - package-lock.json
      - playwright.config.mjs
      - .github/workflows/browser-cache-prime.yml
  workflow_dispatch:
    inputs:
      browsers:
        description: Browser set to cache
        type: choice
        default: chromium
        options:
          - chromium
          - all

permissions:
  contents: read

concurrency:
  group: playwright-cache-prime-${{ github.event.inputs.browsers || 'chromium' }}
  cancel-in-progress: true

jobs:
  prime:
    if: github.repository == 'Tigon32/miniquad' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked test tool metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore shared browser cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.event.inputs.browsers == 'all' && 'all' || 'chromium' }}
      - name: Download browser binaries on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ github.event.inputs.browsers }}" = "all" ]; then
            npx playwright install chromium firefox webkit
          else
            npx playwright install chromium
          fi
      - name: Save cache on master for later PR runs
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.event.inputs.browsers == 'all' && 'all' || 'chromium' }}
      - name: Report cached browser binaries
        run: |
          ls -1 ~/.cache/ms-playwright
