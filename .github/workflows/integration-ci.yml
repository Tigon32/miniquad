name: Miniquad integration CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and WASM target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Rust library tests
        run: cargo test --lib
      - name: WASM library check
        run: cargo check --target wasm32-unknown-unknown --lib
      - name: Build WASM example
        run: cargo build --release --target wasm32-unknown-unknown --example quad
      - name: JavaScript syntax check
        run: node --check js/gl.js
      - name: Browser bridge regression tests
        run: node --test tests/*.test.cjs
      - name: Install locked JavaScript lint tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: ESLint browser bridge
        run: npm run lint:js
      - name: Install browser for this test lane
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run real browser WASM smoke tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run test:browser
          else
            npm run test:browser:chromium
          fi
      - name: Store browser test traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
