name: Miniquad integration CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Cancel the previous run for the same PR. Keep separate workflow dispatch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and WASM target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Restore Cargo package cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml') }}-${{ github.event.pull_request.number || github.run_id }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml') }}-
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Rust library tests
        run: cargo test --lib
      - name: WASM library check
        run: cargo check --target wasm32-unknown-unknown --lib
      - name: Build WASM example
        run: cargo build --release --target wasm32-unknown-unknown --example quad
      - name: Save Cargo package cache before browser checks
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml') }}-${{ github.event.pull_request.number || github.run_id }}
      - name: Install Node and restore npm download cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check documentation and skill references
        run: |
          node scripts/check-docs.mjs
          node --test tests/docs-check.test.mjs
      - name: JavaScript syntax check
        run: node --check js/gl.js
      - name: Browser bridge regression tests
        run: node --test tests/*.test.cjs
      - name: Install locked JavaScript lint tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: ESLint browser bridge
        run: npm run lint:js
      - name: Restore browser binaries for the selected lane
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.event_name == 'workflow_dispatch' && 'all' || 'chromium' }}
      - name: Install browser for this test lane
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Save browser downloads before running tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.event_name == 'workflow_dispatch' && 'all' || 'chromium' }}
      - name: Run real browser WASM smoke tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run test:browser
          else
            npm run test:browser:chromium
          fi
      - name: Store browser test traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
