name: Owner-only auto-merge

# This workflow uses trusted code from master.
# It never checks out a PR head or executes PR-provided commands.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  # GitHub requires contents write to enable auto-merge.
  # The job never checks out or runs an untrusted PR head.
  contents: write
  pull-requests: write

concurrency:
  group: owner-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  owner:
    # Keep a cheap, stable trigger. The trusted Node guard checks the full PR event.
    if: >-
      github.repository == 'Tigon32/miniquad' &&
      github.actor == 'Tigon32' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Get trusted owner policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          persist-credentials: false
      - name: Confirm owner PR metadata
        run: node scripts/owner-automerge.mjs "$GITHUB_EVENT_PATH"
      - name: Enable GitHub gated auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tigon32/miniquad
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --repo "$GH_REPO"
