name: Security advisory review

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 * *'

permissions:
  contents: read

concurrency:
  group: security-advisory-review
  cancel-in-progress: true

jobs:
  npm-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Audit locked npm dependencies
        run: npm audit --package-lock-only --audit-level=high
      - name: Check immutable Action references
        run: node scripts/check-actions.mjs
