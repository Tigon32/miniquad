name: Security advisory review

on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - package-lock.json
      - .github/workflows/security-advisory-review.yml
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 * *'

permissions:
  contents: read

concurrency:
  group: security-advisory-review
  cancel-in-progress: true

jobs:
  npm-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Audit locked npm dependencies
        run: npm audit --package-lock-only --audit-level=high
      - name: Check immutable Action references
        run: node scripts/check-actions.mjs

  rustsec:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install supported Rust and a fixed cargo-audit version
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: Resolve library dependencies for the audit
        run: cargo generate-lockfile
      - name: Scan resolved Rust dependencies against RustSec
        run: cargo audit --file Cargo.lock
      - name: State audit scope
        if: always()
        run: |
          echo "This audit checks the current resolved Rust dependency graph."
          echo "Cargo.lock is generated for the scan and is not committed."
          echo "It is not proof that all platform features or runtime code are secure."
