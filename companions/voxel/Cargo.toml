[workspace]

[package]
name = "miniquad-voxel"
version = "0.1.0"
authors = ["Tigon32 contributors"]
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
description = """
Optional bounded offline voxel terrain and visible-face meshing companion
for Miniquad. Not part of the Miniquad core crate. See docs/offline-voxel.md.
"""
publish = false

# The library target (sim, protocol, chunk/world/mesh/terrain/camera/math)
# depends on nothing but `std`. `miniquad` is a dev-dependency only: the
# `offline` and `mixed` examples are the sole consumers of
# `miniquad::RenderingBackend`. This keeps `vx-server` (a `[[bin]]`) and
# a plain `cargo build --lib` free of any GPU/windowing dependency.
[dependencies]

[dev-dependencies]
miniquad = { path = "../../" }

[features]
# Selects WebGL2 in the `mixed` and `offline` examples. Defaults stay on
# WebGL1 (GLSL 100 shaders are shared; see docs/architecture/voxel-protocol.md,
# "Rendering and GPU resources").
webgl2 = []
# Build offline with the hex example's cell dimensions for issue #131
# measurement. The default cubic example stays unchanged.
measurement-equal-cells = []

[[example]]
name = "offline"
path = "examples/offline.rs"

[[example]]
name = "offline_hex"
path = "examples/offline_hex.rs"

[[example]]
name = "mixed"
path = "examples/mixed.rs"

[[bin]]
name = "vx-server"
path = "src/bin/vx_server.rs"
