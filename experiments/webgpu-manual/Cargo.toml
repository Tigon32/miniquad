[workspace]
# Standalone crate. Not a member of the root Miniquad workspace.

[package]
name = "webgpu-manual-proof"
version = "0.1.0"
edition = "2018"
rust-version = "1.70"
publish = false
description = "Manual JS/WebGPU bridge candidate for the miniquad-webgpu-proof/1 contract (issue #154)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No dependencies. The contract requires a minimal standalone crate.

[profile.release]
opt-level = "s"
panic = "abort"
