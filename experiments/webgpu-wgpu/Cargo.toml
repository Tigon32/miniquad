[workspace]

[package]
name = "webgpu-wgpu-proof"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"

[dependencies.web-sys]
version = "=0.3.107"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Navigator",
    "Event",
    "EventTarget",
    "MouseEvent",
    "KeyboardEvent",
    "FocusEvent",
]

[profile.release]
opt-level = "s"
panic = "abort"
